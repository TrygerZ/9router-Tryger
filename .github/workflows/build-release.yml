name: Build 9router Package

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build application
        run: npm run build

      - name: Pack global npm tarball
        run: |
          tar -czf /tmp/9router-fork.tgz \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --transform='s,^\.,package,' \
            .
          mv /tmp/9router-fork.tgz ./9router-fork.tgz

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest Prebuilt Package
          files: 9router-fork.tgz
          overwrite: true